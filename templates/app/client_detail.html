{% extends 'base.html' %}

{% block title %}
    Mail Sender | Информация о клиенте
{% endblock %}

{% block content %}
    <div class="container">
        <div class="row mt-4 justify-content-center">
            <div class="col-12 col-lg-6">
                <div class="card">
                    <div class="card-header text-center">
                        <h1>Информация о клиенте</h1>
                    </div>
                    <div class="card-body">
                        <p>ФИО: {{ client.surname }} {{ client.name }} {{ client.patronymic }}</p>
                        <p>Email: {{ client.email }}</p>
                    </div>
                    <div class="card-footer">
                        <a href="{% url 'app:client-list' %}" class="btn btn-primary w-100 mt-2">Вернуться</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
